<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Home</title>
    <style>
        /* Modern reset and base layout */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            overflow-x: hidden;
        }

        /* Fluid liquid motion hero wrapper */
        .hero-section {
          position: relative;
          width: 100%;
          height: 50vh;
          overflow: hidden; /* Prevents oversized background from causing scrollbars */
          display: flex;
          align-items: center;
          justify-content: center;
        }
        
        .hero-background {
          position: absolute;
          /* Anchor to exact center */
          top: 50%;
          left: 50%;
          
          /* Make it a large square so rotation remains uniform */
          width: 150vmax; 
          height: 150vmax;
          
          /* Offset by half its size to center the rotation axis */
          margin-top: -75vmax;
          margin-left: -75vmax;
        
          background: linear-gradient(45deg, #ff007f, #7f00ff, #00d4ff, #ff007f);
          background-size: 200% 200%; /* Keeps gradient smooth without over-stretching */
          
          animation: rotateGradient 10s linear infinite;
          transform-origin: center center;
        }
        
        @keyframes rotateGradient {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }

        /* Centered logo container optimized to hide hard logo boundaries */
        .logo-container {
          position: relative;
          z-index: 2;
          background: transparent; /* Changed from #031326 to allow full transparency */
          padding: 20px 40px;
          box-shadow: none; /* Optional: Remove box-shadow if you don't want a card shadow outline */
          display: flex;
          align-items: center;
          justify-content: center;
        }

        /* Responsive styling for your logo image */
        .logo-image {
            max-height: 120px;
            width: auto;
            display: block;
        }

        /* Bottom Half Content Section */
        .content-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        h2 {
            color: #111;
            font-size: 2.2rem;
            margin-top: 0;
        }

        p {
            font-size: 1.15rem;
            color: #555;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .cta-button {
            display: inline-block;
            background-color: #222;
            color: #fff;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .cta-button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <!-- Top Half: Animated Fluid Gradient & Logo -->
    <section class="hero-section">
        <!-- Dedicated animated element layer -->
        <div class="hero-background"></div>
        
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/ExpansionPak/newpaks.github.io/refs/heads/main/271502946%20(1).png" alt="Organization Logo" class="logo-image">
        </div>
    </section>

    <!-- Bottom Half: Clean Content Area -->
    <main class="content-section">
        <h2>Welcome to Our Organization</h2>
        <p>Placeholder</p>
        <a href="#" class="cta-button">Explore Repository</a>
    </main>

</body>
</html>
